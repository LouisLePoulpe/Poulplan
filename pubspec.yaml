name: poulplan
description: "Calendrier personnel local-first de l'écosystème Poulapp."
publish_to: 'none'
version: 0.7.2+14

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.6.0
  collection: ^1.19.1
  crypto: ^3.0.8
  dbus: ^0.8.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.11.0
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.2
  home_widget: ^0.10.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  supabase: ^2.16.5
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  image: ^4.12.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/poulplan-logo.png
    - assets/data/school_holidays_fr.json

# Icône Android : `dart run tool/gen_icons.dart` puis `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/poulplan-logo.png
  adaptive_icon_background: "#FFF6C2"
  adaptive_icon_foreground: assets/branding/generated/adaptive_foreground.png
  adaptive_icon_monochrome: assets/branding/generated/adaptive_monochrome.png
  min_sdk_android: 21

# Écran d'accueil : `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FFF6C2"
  image: assets/branding/generated/splash.png
  color_dark: "#1E1A0E"
  image_dark: assets/branding/generated/splash.png
  android_12:
    image: assets/branding/generated/splash_android12.png
    color: "#FFF6C2"
    color_dark: "#1E1A0E"
  android: true
  ios: false
  web: false
