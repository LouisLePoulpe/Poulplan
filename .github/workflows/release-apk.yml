name: Release APK

# APK Android de la version du pubspec, publié en BROUILLON de release (visible
# seulement par les personnes ayant accès en écriture au dépôt).
#
# Secrets facultatifs (Réglages du dépôt → Secrets and variables → Actions) :
#   ANDROID_DEBUG_KEYSTORE_BASE64  ~/.android/debug.keystore de Louis, en base64 :
#                                  l'APK pourra alors se mettre à jour par-dessus
#                                  l'app installée depuis son PC (même signature).
#   SUPABASE_URL, SUPABASE_ANON_KEY  cloud Poulapp (sinon : version sans cloud).
# Avec ces secrets, l'APK contient l'adresse et la clé du cloud : ne JAMAIS
# publier ce brouillon (dépôt public).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Signature et cloud (secrets facultatifs)
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          signed="non (clé de débogage de la CI : ne se met pas à jour par-dessus l'app installée depuis le PC)"
          cloud="non (version sans cloud)"
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            signed="oui (clé de débogage de Louis)"
          fi
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
            cloud="oui"
          fi
          {
            echo "SIGNED=$signed"
            echo "CLOUD=$cloud"
          } >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Compiler l'APK
        run: |
          args=""
          if [ -f .env ]; then args="--dart-define-from-file=.env"; fi
          flutter build apk --release $args

      - name: Brouillon de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "poulplan-$version.apk"
          printf '%s\n' \
            "APK Android Poulplan $version, compilé par GitHub Actions depuis $GITHUB_SHA." \
            "" \
            "- Signé avec la clé de Louis : $SIGNED" \
            "- Cloud Poulapp inclus : $CLOUD" \
            "" \
            "Brouillon : ne pas le publier si le cloud est inclus (dépôt public)." \
            > notes.md
          gh release create "v$version" "poulplan-$version.apk" \
            --draft --target "$GITHUB_SHA" \
            --title "Poulplan $version (APK)" --notes-file notes.md
